services:
  ui:
    image: node:22-alpine
    container_name: sipon-ui
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    command: ["sh", "-c", "[ -d node_modules/nuxt ] || npm install; npm run dev"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "${UI_EXPOSE_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - .nuxt:/app/.nuxt
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sipon-net

volumes:
  node_modules:
  .nuxt:

networks:
  sipon-net:
    driver: bridge
